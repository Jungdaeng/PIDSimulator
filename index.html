<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ball-Beam PID Simulation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <h1>Ball-Beam PID</h1>
        <p class="subtitle">Neon Physics Lab</p>

        <section class="group">
          <h2>Ball</h2>
          <label>Density (kg/m³)
            <input id="density" type="number" min="100" max="12000" step="10" value="7850" />
          </label>
          <label>Diameter (m)
            <input id="diameter" type="number" min="0.01" max="0.2" step="0.005" value="0.05" />
          </label>
        </section>

        <section class="group">
          <h2>PID Gain (default 0)</h2>
          <label>Kp
            <input id="kp" type="number" step="0.01" value="0" />
          </label>
          <label>Ki
            <input id="ki" type="number" step="0.01" value="0" />
          </label>
          <label>Kd
            <input id="kd" type="number" step="0.01" value="0" />
          </label>
        </section>

        <section class="group">
          <h2>Motor / Beam</h2>
          <label>Max Beam Angle (°)
            <input id="maxAngle" type="number" min="2" max="20" step="1" value="12" />
          </label>
          <label>Motor Gain (rad/s² per input)
            <input id="motorGain" type="number" min="1" max="120" step="1" value="35" />
          </label>
          <label>Motor Damping
            <input id="motorDamping" type="number" min="0" max="20" step="0.1" value="4" />
          </label>
          <label>Motor Inertia
            <input id="motorInertia" type="number" min="0.01" max="10" step="0.01" value="1" />
          </label>
        </section>

        <div class="actions">
          <button id="startBtn">Start</button>
          <button id="pauseBtn">Pause</button>
          <button id="resetBtn">Reset</button>
          <button id="disturbBtn">Disturb Ball</button>
        </div>

        <section class="readout" id="readout"></section>
      </aside>

      <main class="stage-wrap">
        <canvas id="simCanvas" width="980" height="620"></canvas>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
